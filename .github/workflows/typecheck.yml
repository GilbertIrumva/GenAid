name: ci-validation

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  client:
    name: Client (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm install
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
        env:
          VITE_SANITY_PROJECT_ID: fr1v7hol
          VITE_SANITY_DATASET: production

  sanity:
    name: Sanity (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sanity/package-lock.json
      - run: npm install
      - name: Sanity typecheck
        run: npm run typecheck
      - name: Build Sanity Studio
        run: npm run build
        env:
          SANITY_STUDIO_PROJECT_ID: fr1v7hol
          SANITY_STUDIO_DATASET: production

